name: Plugin release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the release
        run: python3 scripts/check-release.py "$GITHUB_REF_NAME"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          previous=$(gh release list --exclude-drafts --limit 100 --json tagName --jq '[.[].tagName | select(startswith("v"))][0] // ""')
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "Discogs Genre & Style ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            ${previous:+--notes-start-tag "$previous"} \
            --latest
